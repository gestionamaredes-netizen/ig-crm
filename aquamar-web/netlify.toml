# El sitio es HTML, CSS y JS: no hay build ni dependencias.
# En Netlify: arrastrá esta carpeta a app.netlify.com/drop, o conectá el repo
# y dejá el comando de build vacío.

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Los nombres de estos archivos no cambian, así que el navegador puede
# guardarlos; el HTML no, para que una corrección se vea enseguida.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
