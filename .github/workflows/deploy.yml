# Publica EL TITÁN (titan/frontend) en GitHub Pages. No tiene nada que ver con
# Aqua Mar, que se despliega en Netlify: ver aquamar/DESPLIEGUE.md.
#
# Se dispara solo a mano. Antes corría en cada push a main, que en este
# repositorio es la rama de los dos proyectos: al crear main, esto publicaría
# Titán sin que nadie lo hubiera pedido, y encima pisa gh-pages con force.
name: Deploy El Titán to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: titan/frontend
        run: npm ci --legacy-peer-deps

      - name: Build
        working-directory: titan/frontend
        env:
          CI: false
        run: npm run build

      - name: Deploy to GitHub Pages
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Fetch or create gh-pages branch
          git fetch origin gh-pages 2>/dev/null || true

          # Create orphan gh-pages branch
          git checkout --orphan gh-pages-temp
          git rm -rf .

          # Copy built files
          cp -r titan/frontend/build/* .

          # Add and commit
          git add .
          git commit -m "Deploy to GitHub Pages [skip ci]" || echo "No changes"

          # Push to gh-pages
          git push origin gh-pages-temp:gh-pages --force
